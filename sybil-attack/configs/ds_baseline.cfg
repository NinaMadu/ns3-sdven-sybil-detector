# =============================================================================
# ds_baseline.cfg — SUMO Kuala Lumpur mobility, NO attack (clean baseline).
# Part of the AdaBoost ML-baseline dataset set (baseline + type2/3/4).
# All four ds_*.cfg are IDENTICAL except the attack section, so the runs are
# directly comparable. Generated for mobility_mode=5 (klbb SUMO trace).
# =============================================================================

# --- Mobility (SUMO Kuala Lumpur, mode 5) ---
mobility_mode  = 5
sumoAutoConfig = true        # auto-set N_Vehicles/N_RSUs from the SUMO trace
boundedRoadMobility = false  # positions come from the trace, not a corridor
routing_test   = false       # MUST be false or N_Vehicles is overridden
simTime        = 120.0       # klbb trace runs to ~119 s

# Fallback topology values (overridden by sumoAutoConfig)
N_Vehicles = 100
N_RSUs     = 6

# --- Coverage ---
rsuCoverageRange = 300.0
awarenessSnapshotSharingEnabled = true

# --- Timing ---
beaconInterval                  = 1.0
rsuReportInterval               = 1.5
rsuVehicleTableSnapshotInterval = 1.0
vehicleSnapshotEveryNReports    = 5
rsuSnapshotEveryNReports        = 5
awarenessReportOverlap          = 0.25

# --- Timeouts ---
rsuVehicleRecordTimeout    = 3.0
vehicleNeighborTimeout     = 3.0
rsuAwarenessTimeout        = 5.0
controllerAwarenessTimeout = 8.0

# --- Attack (disabled) ---
sybil_attack_enabled            = false
sybil_attack_type               = 0
sybil_attack_percentage         = 0
controller_malicious_assumption = false

# --- Solution mode (1 = log + FL placeholder; detection mode does not affect
#     the communication_log used for ML-baseline data generation) ---
solution_mode = 1
