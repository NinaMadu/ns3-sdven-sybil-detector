# =============================================================================
# sybil_fl_detection.cfg — Sybil attack with Federated Learning detection (proposed method)
# Attack type 2 (position falsification), 40% attackers, FL-based detection
# Usage: ./waf --run "Sybil-Developing-Improved --config=sybil-attack/configs/sybil_fl_detection.cfg"
# =============================================================================

# --- Network topology ---
N_Vehicles = 12
N_RSUs     = 3
simTime    = 100.0
routing_test = false
mobility_mode = 2

# --- Timing ---
beaconInterval              = 1.0
rsuReportInterval           = 1.5
rsuVehicleTableSnapshotInterval = 1.0
vehicleSnapshotEveryNReports    = 5
rsuSnapshotEveryNReports        = 5
awarenessReportOverlap          = 0.25

# --- Timeouts ---
rsuVehicleRecordTimeout    = 3.0
vehicleNeighborTimeout     = 3.0
rsuAwarenessTimeout        = 5.0
controllerAwarenessTimeout = 8.0

# --- Coverage ---
rsuCoverageRange = 300.0
awarenessSnapshotSharingEnabled = true

# --- Attack ---
sybil_attack_enabled           = true
sybil_attack_type              = 2   # position falsification
sybil_attack_percentage        = 40
controller_malicious_assumption = false

# --- Detection method: 0=none 1=rule-based 2=ML 3=FL 4=hybrid ---
proposed_method = 3
