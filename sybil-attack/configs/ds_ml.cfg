# =============================================================================
# ds_ml.cfg — MODE_BASELINE_ML (3): AdaBoost DPM-eigenvalue baseline.
# Generates a Sybil scenario and, at end-of-run, evaluates the AdaBoost
# baseline (Laouiti et al. 2022) over the combined generated dataset.
# Run: ./waf --run "Sybil-Developing-Improved --config=sybil-attack/configs/ds_ml.cfg"
# Note: requires the combined dataset (auto-built from sybil-attack/datasets/run_*).
# =============================================================================

# --- Network topology ---
N_Vehicles = 100
N_RSUs     = 6
simTime    = 300.0
routing_test  = false
mobility_mode = 2

# --- Road corridor (matches the dataset configs) ---
boundedRoadMobility = true
roadStartX    = 20.0
roadLength    = 3000.0
roadBaseY     = 40.0
roadLaneCount = 4
laneSpacing   = 4.0
rsuOffsetY    = 60.0
vehicleSpacing = 30.0

# --- Coverage ---
rsuCoverageRange = 300.0
awarenessSnapshotSharingEnabled = true

# --- Timing ---
beaconInterval              = 1.0
rsuReportInterval           = 1.5
rsuVehicleTableSnapshotInterval = 1.0
vehicleSnapshotEveryNReports    = 5
rsuSnapshotEveryNReports        = 5
awarenessReportOverlap          = 0.25

# --- Timeouts ---
rsuVehicleRecordTimeout    = 3.0
vehicleNeighborTimeout     = 3.0
rsuAwarenessTimeout        = 5.0
controllerAwarenessTimeout = 8.0

# --- Attack (enabled so the run carries both classes) ---
sybil_attack_enabled            = true
sybil_attack_type               = 2
sybil_attack_percentage         = 20
controller_malicious_assumption = false

# --- Solution mode: 3 = MODE_BASELINE_ML (AdaBoost DPM-eigenvalue baseline) ---
solution_mode = 3
