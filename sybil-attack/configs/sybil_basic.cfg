# =============================================================================
# sybil_basic.cfg — basic Sybil attack (type 0), 30% attackers, lightweight solution mode
# Usage: ./waf --run "Sybil-Developing-Improved --config=sybil-attack/configs/sybil_basic.cfg"
# =============================================================================

# --- Network topology ---
N_Vehicles = 10
N_RSUs     = 2
simTime    = 60.0
routing_test = false
mobility_mode = 2

# --- Timing ---
beaconInterval              = 1.0
rsuReportInterval           = 1.5
rsuVehicleTableSnapshotInterval = 1.0
vehicleSnapshotEveryNReports    = 5
rsuSnapshotEveryNReports        = 5
awarenessReportOverlap          = 0.25

# --- Timeouts ---
rsuVehicleRecordTimeout    = 3.0
vehicleNeighborTimeout     = 3.0
rsuAwarenessTimeout        = 5.0
controllerAwarenessTimeout = 8.0

# --- Coverage ---
rsuCoverageRange = 300.0
awarenessSnapshotSharingEnabled = true

# --- Attack ---
sybil_attack_enabled           = true
sybil_attack_type              = 0   # 0=basic identity spoofing
sybil_attack_percentage        = 30
controller_malicious_assumption = false

# --- Solution mode: 1=FL placeholder 2=RSSI placeholder 3=ML placeholder 4=lightweight 5=full placeholder 6=no detection ---
solution_mode = 4
