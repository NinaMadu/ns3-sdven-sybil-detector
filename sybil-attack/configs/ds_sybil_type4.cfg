# =============================================================================
# ds_sybil_type4.cfg — 100-vehicle dataset, 20% Sybil, attack type 4
# Part of the 4-scenario dataset set (baseline + Sybil types 2/3/4).
# Run via: sybil-attack/run_dataset_100.sh   (archives outputs per scenario)
# =============================================================================

# --- Network topology ---
N_Vehicles = 100
N_RSUs     = 6
simTime    = 300.0
routing_test  = false
mobility_mode = 2

# --- Road corridor (3 km, 4 lanes; 100 veh @ 30 m ≈ full corridor) ---
boundedRoadMobility = true
roadStartX    = 20.0
roadLength    = 3000.0
roadBaseY     = 40.0
roadLaneCount = 4
laneSpacing   = 4.0
rsuOffsetY    = 60.0
vehicleSpacing = 30.0

# --- Coverage (6 RSUs @ 500 m spacing, 300 m radius → continuous w/ overlap) ---
rsuCoverageRange = 300.0
awarenessSnapshotSharingEnabled = true

# --- Timing ---
beaconInterval              = 1.0
rsuReportInterval           = 1.5
rsuVehicleTableSnapshotInterval = 1.0
vehicleSnapshotEveryNReports    = 5
rsuSnapshotEveryNReports        = 5
awarenessReportOverlap          = 0.25

# --- Timeouts ---
rsuVehicleRecordTimeout    = 3.0
vehicleNeighborTimeout     = 3.0
rsuAwarenessTimeout        = 5.0
controllerAwarenessTimeout = 8.0

# --- Attack (enabled) ---
sybil_attack_enabled            = true
sybil_attack_type               = 4
sybil_attack_percentage         = 20
controller_malicious_assumption = false

# --- Solution mode: 1=FLEMDS FL ---
solution_mode = 1
